<style>
.kse-live{display:flex;gap:12px;width:100%;max-width:1800px;margin:0 auto}
.kse-live-player{position:relative;flex:1 1 0;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.kse-live-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.kse-live-tag{position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,.65);color:#fff;font-size:clamp(13px,0.6vw + 8px,20px);padding:3px 10px;border-radius:6px}
.kse-live-zoom{display:inline-block;margin:12px 0 0;padding:8px 18px;border-radius:8px;background:#1a73e8;color:#fff;text-decoration:none;font-size:clamp(14px,0.7vw + 9px,20px)}
.kse-live-close{display:none}
.kse-live-note{width:100%;max-width:1800px;margin:12px auto 0;font-size:clamp(14px,0.7vw + 9px,22px);line-height:1.8;color:#555;background:none}
.kse-live:target{position:fixed;top:0;left:0;width:100vw;height:100vh;max-width:none;margin:0;padding:12px;box-sizing:border-box;background:#000;z-index:2147483000;align-items:center;justify-content:center}
.kse-live:target .kse-live-player{flex:0 0 auto;width:min(50vw - 18px,(100vh - 24px)*16/9)}
.kse-live:target .kse-live-close{display:block;position:absolute;top:12px;right:16px;z-index:5;color:#fff;background:rgba(255,255,255,.25);padding:6px 16px;border-radius:6px;text-decoration:none;font-size:16px}
@media (orientation:portrait){
  .kse-live{flex-direction:column}
  .kse-live-player{flex:0 0 auto}
  .kse-live:target .kse-live-player{width:calc(100vw - 24px)}
}
</style>

<div class="kse-live" id="kse-live">
  <a class="kse-live-close" href="#kse-live-off">✕ 關閉放大</a>
  <div class="kse-live-player"><span class="kse-live-tag">場地一</span>
    <iframe src="https://www.youtube.com/embed/gbW8A-KV_jY?autoplay=1&amp;mute=0&amp;playsinline=1&amp;rel=0"
      title="場地一" referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
  <div class="kse-live-player"><span class="kse-live-tag">場地二</span>
    <iframe src="https://www.youtube.com/embed/pZvWMeQ8DY4?autoplay=1&amp;mute=1&amp;playsinline=1&amp;rel=0"
      title="場地二" referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<a class="kse-live-zoom" href="#kse-live">⛶ 放大雙畫面</a>

<div class="kse-live-note">
  1.預設開場地一的聲音，建議只開一邊的聲音(場地一或場地二)，請點喇叭圖示切換聲音或靜音。<br>
  2.直播畫面比現場延遲數秒，出價以現場為準。
</div>
